[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # los enums str+Enum ya están en la BD; no cambiarlos

[tool.ruff.lint.flake8-bugbear]
# Idioma estándar de FastAPI: Depends()/Query() como valor por defecto
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
